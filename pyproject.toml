[project]
name = "qfer-preflight"
version = "0.2.0"
description = "Offline pre-submission validator for California Energy Commission QFER Consumption CSV filings, where every finding cites the published rule it came from."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Chelsea Kelly-Reif" }]
keywords = ["qfer", "cec", "csv", "validation", "energy", "regulatory-reporting"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Utilities",
]
# The validator itself runs on the standard library alone. Keeping the runtime
# dependency set empty is deliberate: an offline tool that a utility runs over
# its own filing data should not drag in a supply chain to do it.
dependencies = []

[project.urls]
Homepage = "https://github.com/ChelseaKR/qfer-preflight"
Source = "https://github.com/ChelseaKR/qfer-preflight"
Issues = "https://github.com/ChelseaKR/qfer-preflight/issues"
Changelog = "https://github.com/ChelseaKR/qfer-preflight/blob/main/CHANGELOG.md"

[project.scripts]
qfer-preflight = "qfer_preflight.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.15.0",
  "mypy>=1.18.0",
  "bandit>=1.8.0",
  "pip-audit>=2.9.0",
  "jsonschema>=4.26.0",
  "types-jsonschema>=4.26.0.20260518",
  # Declared rather than inherited. tests/test_gate_parity.py parses the
  # workflow files, and PyYAML was only present because bandit happens to
  # depend on it. A gate resting on another tool's transitive dependency
  # stops running the day that tool drops it.
  "pyyaml>=6.0.0",
  "types-PyYAML>=6.0.0",
]

[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qfer_preflight"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--cov=qfer_preflight",
  "--cov-report=term-missing",
  "--cov-fail-under=90",
]

[tool.coverage.run]
branch = true
source = ["src/qfer_preflight"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "C90",  # mccabe complexity
  "UP",   # pyupgrade
  "SIM",  # flake8-simplify
  "RUF",  # ruff-specific
]
ignore = [
  # The rule quotes and code tables in this project are transcribed from
  # published CEC documents. Line-splitting them would obscure the fidelity
  # that is the whole point, so long strings are tolerated there.
  "E501",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.12"
# `scripts` is in the list because it was not: a `def f(x: int) -> str: return x`
# added to scripts/bench_large_file.py passed `make verify` untouched. A tool
# that does not look at a directory reports it clean.
files = ["src", "tests", "scripts"]
strict = true
warn_unreachable = true
warn_unused_ignores = false
disallow_untyped_defs = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
